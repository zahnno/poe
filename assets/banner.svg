<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Poe — a quiet place to think">
  <title>Poe — a quiet place to think</title>
  <defs>
    <radialGradient id="glassGlow" gradientUnits="userSpaceOnUse" cx="50" cy="82" r="26">
      <stop offset="0" stop-color="#FFF6CF"/>
      <stop offset="0.5" stop-color="#FFB425"/>
      <stop offset="1" stop-color="#FA9205" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="flameGrad" gradientUnits="userSpaceOnUse" x1="50" y1="72" x2="50" y2="89">
      <stop offset="0" stop-color="#FA9205"/>
      <stop offset="0.5" stop-color="#FFB425"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="skirtGrad" gradientUnits="userSpaceOnUse" x1="31" y1="47" x2="69" y2="56">
      <stop offset="0" stop-color="#9F876C"/><stop offset="1" stop-color="#5D4C3D"/>
    </linearGradient>
    <linearGradient id="fountGrad" gradientUnits="userSpaceOnUse" x1="34" y1="100" x2="66" y2="114">
      <stop offset="0" stop-color="#9F876C"/><stop offset="1" stop-color="#5D4C3D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FE6F0"/>
      <stop offset="0.5" stop-color="#7B8CFF"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M37,55 C30,68 30,82 37,95 L63,95 C70,82 70,68 63,55 Z"/>
    </clipPath>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="380" rx="26"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="halo" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#08090E"/>

    <!-- the aurora: four blurred orbs, the same ones the app breathes behind your text -->
    <g filter="url(#soft)" opacity="0.5">
      <circle cx="150" cy="60" r="150" fill="#5FE6F0" opacity="0.30"/>
      <circle cx="700" cy="360" r="180" fill="#7B8CFF" opacity="0.26"/>
      <circle cx="1080" cy="90" r="160" fill="#A78BFA" opacity="0.24"/>
      <circle cx="980" cy="330" r="130" fill="#F472B6" opacity="0.16"/>
    </g>

    <!-- the lantern's own light, spilling onto the panel -->
    <ellipse cx="221" cy="236" rx="160" ry="150" fill="#FFB425" opacity="0.16" filter="url(#soft)"/>

    <!-- ── the mark ────────────────────────────────────────────────── -->
    <g transform="translate(132,56) scale(1.78)">
      <ellipse cx="50" cy="78" rx="24" ry="30" fill="#FFB425" opacity="0.45" filter="url(#halo)">
        <animate attributeName="opacity" values="0.36;0.54;0.42;0.5;0.36" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M37,55 C30,68 30,82 37,95 L63,95 C70,82 70,68 63,55 Z" fill="url(#glassGlow)"/>
      <path d="M50,72 C57,81 55,89 50,89 C45,89 43,81 50,72 Z" fill="url(#flameGrad)">
        <animate attributeName="opacity" values="1;0.86;1;0.93;1" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <g clip-path="url(#glassClip)" stroke="#5D4C3D" stroke-width="2.6" fill="none">
        <path d="M35,63 L65,87"/><path d="M65,63 L35,87"/><path d="M34,89 L66,89"/>
      </g>
      <g stroke="#5D4C3D" stroke-width="3.2" fill="none">
        <path d="M28,31 C19,52 19,84 28,103"/>
        <path d="M72,31 C81,52 81,84 72,103"/>
      </g>
      <rect x="19" y="30" width="9" height="3" rx="1.2" fill="#9F876C"/>
      <rect x="72" y="30" width="9" height="3" rx="1.2" fill="#9F876C"/>
      <path d="M43.03,13.61 A7,7 0 0 1 56.97,13.61" stroke="#9F876C" stroke-width="3" fill="none"/>
      <path d="M35,19 L65,19 L71,26 L29,26 Z" fill="#9F876C"/>
      <rect x="37" y="26" width="26" height="6" rx="2.4" fill="#5D4C3D"/>
      <rect x="35" y="32" width="30" height="6" rx="2.4" fill="#9F876C"/>
      <rect x="39" y="38" width="22" height="9" rx="3.6" fill="#5D4C3D"/>
      <g fill="#08090E" opacity="0.75">
        <circle cx="43" cy="42.9" r="1.4"/><circle cx="50" cy="42.9" r="1.4"/><circle cx="57" cy="42.9" r="1.4"/>
      </g>
      <path d="M37,47 L63,47 L69,56 L31,56 Z" fill="url(#skirtGrad)"/>
      <rect x="33" y="93" width="34" height="7" rx="2.8" fill="#9F876C"/>
      <path d="M34,100 L66,100 L63,114 L37,114 Z" fill="url(#fountGrad)"/>
      <rect x="45" y="96" width="10" height="7" rx="2.8" fill="#5D4C3D"/>
      <path d="M35,114 L65,114 L68,128 L32,128 Z" fill="#9F876C"/>
      <rect x="30" y="128" width="40" height="5" rx="2" fill="#5D4C3D"/>
    </g>

    <!-- ── the words ───────────────────────────────────────────────── -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="418" y="180" font-size="118" font-weight="600" letter-spacing="-3" fill="#E5E9F5">Poe</text>
      <rect x="424" y="210" width="300" height="2" rx="1" fill="url(#rule)"/>
      <text x="422" y="254" font-size="30" font-weight="400" fill="#98A0B6">A quiet place to think.</text>
      <text x="422" y="298" font-size="17" font-weight="500" letter-spacing="1.7" fill="#5FE6F0" opacity="0.85">
        macOS · SWIFTUI · NO DEPENDENCIES
      </text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  </g>
</svg>
